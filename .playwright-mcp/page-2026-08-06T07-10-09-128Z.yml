            - generic [ref=f22e980]: ts
            - code [ref=f22e982]:
              - generic [ref=f22e983]: type ItemType = MenuItemType | SubMenuType | MenuItemGroupType | MenuDividerType
              - generic [ref=f22e984]: // 所有菜单项共享的属性
              - generic [ref=f22e985]: "interface ItemSharedProps {"
              - generic [ref=f22e986]: "style?: CSSProperties // 自定义行内样式"
              - generic [ref=f22e987]: "class?: string // 自定义类名"
              - generic [ref=f22e988]: "}"
              - generic [ref=f22e989]: "interface MenuItemType extends ItemSharedProps {"
              - generic [ref=f22e990]: "key: string | number // 唯一标识（必填）"
              - generic [ref=f22e991]: "label?: string | VNode // 菜单项标题"
              - generic [ref=f22e992]: "icon?: VNode | (() => VNode) // 菜单图标"
              - generic [ref=f22e993]: "title?: string // 收起时展示的悬浮标题"
              - generic [ref=f22e994]: "disabled?: boolean // 是否禁用，默认 false"
              - generic [ref=f22e995]: "danger?: boolean // 危险样式，默认 false"
              - generic [ref=f22e996]: "onClick?: (info: MenuItemClickInfo) => void // 点击回调（先于 Menu 的 click 事件触发）"
              - generic [ref=f22e997]: "onMouseenter?: (info: MenuItemHoverInfo) => void // 鼠标移入回调"
              - generic [ref=f22e998]: "onMouseleave?: (info: MenuItemHoverInfo) => void // 鼠标移出回调"
              - generic [ref=f22e999]: "}"
              - generic [ref=f22e1000]: "interface SubMenuType extends ItemSharedProps {"
              - generic [ref=f22e1001]: "key: string | number // 唯一标识（必填）"
              - generic [ref=f22e1002]: "children: ItemType[] // 子菜单项"
              - generic [ref=f22e1003]: "label?: string | VNode // 子菜单标题"
              - generic [ref=f22e1004]: "icon?: VNode | (() => VNode) // 菜单图标"
              - generic [ref=f22e1005]: "title?: string // 收起时展示的悬浮标题"
              - generic [ref=f22e1006]: "disabled?: boolean // 是否禁用，默认 false"
              - generic [ref=f22e1007]: "theme?: 'light' | 'dark' // 子菜单主题（默认从 Menu 继承）"
              - generic [ref=f22e1008]: "popupClassName?: string // 弹出层类名"
              - generic [ref=f22e1009]: "popupOffset?: [number, number] // 弹出层偏移 [x, y]"
              - generic [ref=f22e1010]: "rootClassName?: string // 弹出层根类名"
              - generic [ref=f22e1011]: "expandIcon?: VNode | ((info: { isOpen: boolean }) => VNode) // 自定义展开图标"
              - generic [ref=f22e1012]: "onMouseenter?: (info: MenuItemHoverInfo) => void"
              - generic [ref=f22e1013]: "onMouseleave?: (info: MenuItemHoverInfo) => void"
              - generic [ref=f22e1014]: "onTitleClick?: (info: { key; domEvent: MouseEvent }) => void // 点击子菜单标题回调"
              - generic [ref=f22e1015]: "}"
              - generic [ref=f22e1016]: "interface MenuItemGroupType extends ItemSharedProps {"
              - generic [ref=f22e1017]: "type: 'group' // 分组标识（必填）"
              - generic [ref=f22e1018]: "label?: string | VNode // 分组标题"
              - generic [ref=f22e1019]: "children: ItemType[] // 分组内菜单项"
              - generic [ref=f22e1020]: "key?: string | number // 可选唯一标识"
              - generic [ref=f22e1021]: "}"
              - generic [ref=f22e1022]: "interface MenuDividerType extends ItemSharedProps {"
              - generic [ref=f22e1023]: "type: 'divider' // 分割线标识（必填）"
              - generic [ref=f22e1024]: "dashed?: boolean // 是否虚线，默认 false"
              - generic [ref=f22e1025]: "}"
