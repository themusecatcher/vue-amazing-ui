# dev-comp 精简度量报告
# 每个组件/阶段完成时，写入 ~/.codebuddy/.metrics/reports/vaui-{组件名}-{日期}.yaml
# 仅保留对组件开发有意义的核心字段

component: {组件名}
phase: P1
requirement_type: feature                    # feature | bugfix
files_changed: 0
lines_added: 0
lines_deleted: 0
rollback_count: 0
user_corrections: 0
first_time_right: true
lint_pass_first_try: true
type_check_pass: true
browser_verified: true
devlog_generated: true
knowledge_updated: true
start_date: "{YYYY-MM-DD}"
complete_date: "{YYYY-MM-DD}"
